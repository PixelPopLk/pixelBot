name = "pixelbot"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 🛡️ Dashboard එකේ Variables සහ Secrets මකා දැමීම වලක්වන Flag එක:
keep_vars = true

# 📌 නිතර Reset නොවිය යුතු Variables මෙතනම Save කර තැබීම:
[vars]
STORAGE_CHANNEL_ID = "-1004297192169"
ADMIN_ID = "6857599209"
BOT_USERNAME = "PixelPopStorebot"
WEBSITE_URL = "https://pixelpoplk.pages.dev"
BOC_ACCOUNT_NAME = "R.M.P. Madusanka"
BOC_ACCOUNT_NUMBER = "1234567890" # ඔයාගේ BOC Account Number එක මෙතනට දාන්න

# Main Channel Force Sub තොරතුරු (ඔයාගේ Channel Link & ID එක මෙතනට දාන්න):
FORCE_SUB_CHANNEL_ID = "-1003677392472"
FORCE_SUB_CHANNEL_LINK = "https://t.me/pixel_pop_lk"
FORCE_SUB_CHANNEL_NAME = "PixelPop LK"

# 🛡️ Backup Bot & Channel (Main Bot එකට ප්‍රශ්නයක් වුවහොත් භාවිතයට):
BACKUP_BOT_USERNAME = "PixelPopBackupBot" # ඔබගේ 2nd Backup Bot එකේ Username එක මෙතනට දාන්න
BACKUP_CHANNEL_LINK = "https://t.me/pixel_pop_lk" # Backup Channel Link එක

# 🎬 TMDb Auto Poster API Key (themoviedb.org වෙතින් නොමිලේ ලබාගත හැකි API Key එක):
TMDB_API_KEY = "" # මෙතනට ඔබගේ TMDb v3 API Key එක ඇතුළත් කරන්න

# ⏰ Cron Trigger: සෑම විනාඩි 10කට වරක් Auto-Deletion සහ Reminder ක්‍රියාත්මක කිරීම
[triggers]
crons = ["*/10 * * * *"]

